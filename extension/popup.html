<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body{width:260px;background:#09090e;color:#e9e9f2;font-family:sans-serif;margin:0;padding:16px}
  h1{font-size:15px;margin:0 0 4px;background:linear-gradient(135deg,#7c5cfc,#fc5c8a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  p{font-size:11px;color:#797991;line-height:1.5;margin:0 0 12px}
  a.btn{display:block;text-align:center;background:linear-gradient(135deg,#7c5cfc,#9a7dff);color:white;text-decoration:none;padding:9px;border-radius:8px;font-size:12px;font-weight:700}
  .kbd{display:inline-block;padding:1px 6px;border:1px solid #2a2a38;border-radius:4px;font-size:10px;color:#797991}
</style>
</head>
<body>
  <h1>⚡ B Tools</h1>
  <p>This extension performs page automation for the B Tools app. It never talks to the login/session on its own — open the app to use it.</p>
  <p>Auto-Fill shortcut: <span class="kbd">Alt</span>+<span class="kbd">Q</span> fills the next answer into whatever's focused.</p>
  <a class="btn" href="https://benkku.me/.../" target="_blank" rel="noopener">Open B Tools</a>
</body>
</html>
