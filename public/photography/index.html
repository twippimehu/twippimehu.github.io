<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography — benkku.me</title>
<meta name="description" content="Photography portfolio.">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<header class="masthead">
  <a class="wordmark" href="/">benkku.me</a>
  <nav class="nav">
    <a href="/photography/">Photography</a>
    <a href="/about/">About</a>
    <a class="mystery" href="/.../" aria-label="...">. . .</a>
  </nav>
</header>

<section class="section" style="padding-top:56px">
  <div class="section-header">
    <h2>Photography</h2>
  </div>
  <div class="gallery-toolbar" id="categoryFilter"></div>
  <div class="masonry" id="masonry"></div>
</section>

<footer>
  <span>© <span id="year"></span> benkku.me</span>
  <span>Helsinki</span>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lightbox-prev" id="lbPrev" aria-label="Previous photo">&#8249;</button>
  <img id="lbImage" alt="">
  <button class="lightbox-next" id="lbNext" aria-label="Next photo">&#8250;</button>
  <div class="lightbox-caption" id="lbCaption"></div>
</div>

<script type="module" src="/assets/js/site/gallery.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear()</script>
</body>
</html>
