<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>. . .</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-mark">. . .</div>
    <form id="loginForm" autocomplete="off">
      <div class="login-field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="login-submit" type="submit">Enter</button>
    </form>
    <div class="login-message" id="loginMessage"></div>
    <div style="text-align:center;margin-top:28px"><a href="/downloads/" style="font-size:11px;color:var(--paper-dim);letter-spacing:0.05em">Download the extension →</a></div>
  </div>
</div>
<script type="module" src="/assets/js/site/login.js"></script>
</body>
</html>
